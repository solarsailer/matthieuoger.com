# Basic.
baseURL = 'https://matthieuoger.com/'
locale = 'en-us'

# Metadata.
title = 'Matthieu Oger'
copyright = '© 2026 **Matthieu Oger**'

[permalinks]
  [permalinks.section]
    posts = '/articles/'
  [permalinks.page]
    posts = '/:year/:month/:filename/'

# Pagination.
[pagination]
  pagerSize = 9
  path = '' # Keep the historical URLs: /articles/2/, not /articles/page/2/.

[outputs]
  home = ['html', 'rss']
  page = ['html']
  section = ['html']
  taxonomy = []
  term = []

[markup.goldmark.renderer]
  unsafe = true # Allow HTML in md files.

[markup.goldmark.extensions.typographer]
  disable = true # Keep quotes and dashes as typed.
