{{- /*
  Image stored next to the post, for what Markdown cannot express:
  a width, or a caption (the image is then wrapped in a <figure>).

  {{< image src="photo.jpg" alt="…" title="…" width="300" />}}

  {{< image src="photo.jpg" alt="…" title="…" >}}
  Caption, in Markdown.
  {{< /image >}}
*/ -}}

{{- $src := .Get "src" -}}
{{- with .Page.Resources.Get $src -}}
	{{- $src = .RelPermalink -}}
{{- end -}}

{{- $caption := strings.TrimSpace .Inner -}}

{{- define "_partials/shortcodes/image-tag.html" -}}
<img
	src="{{ .src }}"
	{{- with .shortcode.Get "alt" }} alt="{{ . }}"{{ end }}
	{{- with .shortcode.Get "title" }} title="{{ . }}"{{ end }}
	{{- with .shortcode.Get "width" }} style="width: {{ . }}px"{{ end }}
/>
{{- end -}}

{{- if $caption -}}
	<figure>
		{{ partial "shortcodes/image-tag.html" (dict "src" $src "shortcode" .) }}
		<figcaption>{{ $caption | .Page.RenderString }}</figcaption>
	</figure>
{{- else -}}
	<p>{{ partial "shortcodes/image-tag.html" (dict "src" $src "shortcode" .) }}</p>
{{- end -}}
