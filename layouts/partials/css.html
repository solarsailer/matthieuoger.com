{{ $opts := dict "transpiler" "dartsass" "targetPath" "css/main.css" }}
{{ with resources.Get "sass/index.scss" | toCSS $opts | postCSS | minify | fingerprint }}
  <link
    rel="stylesheet"
    href="{{ .RelPermalink }}"
    integrity="{{ .Data.Integrity }}"
    crossorigin="anonymous"
  />
{{ end }}
