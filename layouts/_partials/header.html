<header class="page-header" id="page_header">
  <nav class="global-menu">
    <h1 class="global-menu__title">
      <a href="/">
        {{- partial "icons/logo.svg" . -}}
        &nbsp;
        <span>Matthieu</span>
        Oger
      </a>
    </h1>

    <ul class="global-menu__list">
      <li>
        <a
          class="button menu-button"
          href="/about/"
          {{ if eq .RelPermalink "/about/" }}aria-current="page"{{ end }}
        >
          About
        </a>
      </li>
      <li>
        <a
          class="button menu-button"
          href="/articles/"
          {{ if eq .RelPermalink "/articles/" }}aria-current="page"{{ end }}
        >
          Articles
        </a>
      </li>
      <li>
        <a class="button menu-button" href="/atom.xml" target="_blank">
          {{- partial "icons/rss.svg" . -}}
          RSS
        </a>
      </li>
    </ul>
  </nav>

  <hr class="page-header__separator" />
</header>
